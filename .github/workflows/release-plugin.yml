name: release-plugin
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z)"
        required: true

jobs:
  release:
    name: Build & Release IntelliJ Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            echo "Version required" >&2; exit 1
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $V (expected X.Y.Z)" >&2; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          IFS='.' read -r major minor patch <<< "$V"
          echo "next_version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Set plugin version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          version = os.environ["PLUGIN_VERSION"]
          path = Path("plugin/gradle.properties")
          text = path.read_text() if path.exists() else ""
          cleaned = re.sub(r'^\s*pluginVersion\s*=\s*[^\n]*\n?', '', text, flags=re.M)
          path.write_text(f"pluginVersion={version}\n{cleaned}")
          PY
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        working-directory: plugin
        run: |
          chmod +x ./gradlew
          ./gradlew buildPlugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: plugin/build/distributions/*.zip

      - name: Bump next version on default branch
        shell: bash
        run: |
          BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          version = os.environ["NEXT_VERSION"]
          path = Path("plugin/gradle.properties")
          text = path.read_text() if path.exists() else ""
          cleaned = re.sub(r'^\s*pluginVersion\s*=\s*[^\n]*\n?', '', text, flags=re.M)
          path.write_text(f"pluginVersion={version}\n{cleaned}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/gradle.properties
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump plugin version to $NEXT_VERSION [skip ci]"
            git push origin "HEAD:$BRANCH"
          fi
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
